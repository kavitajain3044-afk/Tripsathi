name: TripSathi Build
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Prepare web files and icons
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          [ -f icon.png ] && cp icon.png assets/icon-only.png && cp icon.png assets/icon-foreground.png || true
          [ -f splash.png ] && cp splash.png assets/splash.png && cp splash.png assets/splash-dark.png || true
      - name: Create Android project
        run: |
          npx cap add android
          npx @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#c2410c' --iconBackgroundColorDark '#c2410c' --splashBackgroundColor '#c2410c' --splashBackgroundColorDark '#c2410c' || echo "icon step skipped"
          sed -i '0,/<application/s//<uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <application/' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TripSathi-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
