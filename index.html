<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TripSathi</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#faf6ef;--cd:#fff;--ink:#2a2118;--mut:#7a6c5c;--ac:#c2410c;--ac2:#fde8d8;--bd:#eadfce}
@media(prefers-color-scheme:dark){:root{--bg:#17120d;--cd:#231c15;--ink:#f3eadd;--mut:#b3a590;--ac:#fb923c;--ac2:#3a2616;--bd:#3a2e22}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:640px;margin:0 auto;padding:16px}h1{font:700 28px Georgia,serif;margin:8px 0 4px}.m{color:var(--mut);font-size:14px}
input,select{width:100%;padding:13px;border:1px solid var(--bd);border-radius:12px;background:var(--cd);color:var(--ink);font:inherit}
button{font:inherit;cursor:pointer}.b{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:13px;width:100%;font-weight:600;margin-top:10px;display:block;text-align:center;text-decoration:none}
.b2{background:var(--ac2);color:var(--ac)}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.ch{border:1px solid var(--bd);background:var(--cd);color:var(--ink);border-radius:99px;padding:8px 14px;font-size:14px}
